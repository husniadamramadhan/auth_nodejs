apiVersion: apps/v1
kind: Deployment
metadata:
  name: authserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authserver
  template:
    metadata:
      labels:
        app: authserver
    spec:
      containers:
      - name: authserver
        image: gcr.io/<YOUR_PROJECT_ID>/authserver:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MONGODB_URI
          value: "mongodb://mongo:27017/auth"
        - name: DB_NAME
          value: "auth"
        - name: ACCESS_TOKEN_SECRET
          value: "<YOUR_ACCESS_TOKEN_SECRET>"
        - name: REFRESH_TOKEN_SECRET
          value: "<YOUR_REFRESH_TOKEN_SECRET>"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: authserver
spec:
  selector:
    app: authserver
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer